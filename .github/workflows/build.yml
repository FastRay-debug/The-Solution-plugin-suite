name: Build plugins

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "SkinEditor/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to publish a GitHub Release when a v* tag is pushed

jobs:
  tests:
    name: Automated DSP tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          key: linux-tests
          max-size: 2G
      - name: Install Linux build libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libcurl4-openssl-dev ninja-build
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSOLUTION_BUILD_TESTS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build tests
        run: cmake --build build --target SuiteTests
      - name: Run tests
        run: ./build/SuiteTests_artefacts/Release/SuiteTests

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(\S+ VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Download WebView2 SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2" -OutFile webview2.zip
          Expand-Archive -Path webview2.zip -DestinationPath webview2 -Force
          if (-not (Test-Path "webview2/build/native/include/WebView2.h")) { throw "WebView2.h missing after download" }

      # Compiler cache: later runs only recompile what changed (JUCE compiles into every plugin).
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          key: windows-release
          variant: ccache
          max-size: 5G

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUNDLE_SKINS=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Cache stats
        run: ccache --show-stats

      - name: Gather plugins
        shell: pwsh
        run: |
          $out = "The Solution"
          New-Item -ItemType Directory -Force -Path "$out/VST3","$out/CLAP","$out/Standalone","$out/Skins" | Out-Null
          Copy-Item "UI/skins/*.jpg" "$out/Skins"
          Get-ChildItem build -Directory -Filter *_artefacts | ForEach-Object {
            $rel = Join-Path $_.FullName "Release"
            Get-ChildItem "$rel/VST3" -Directory -Filter *.vst3 -ErrorAction SilentlyContinue | Copy-Item -Destination "$out/VST3" -Recurse -Force
            Get-ChildItem "$rel/CLAP" -File -Filter *.clap -ErrorAction SilentlyContinue | Copy-Item -Destination "$out/CLAP" -Force
            Get-ChildItem "$rel/Standalone" -File -Filter *.exe -ErrorAction SilentlyContinue | Copy-Item -Destination "$out/Standalone" -Force
          }
          New-Item -ItemType Directory -Force -Path "$out/Utility" | Out-Null
          Copy-Item "build/SolutionUtility_artefacts/Release/Solution Utility.exe" "$out/Utility" -Force
          if (-not (Test-Path "$out/Utility/Solution Utility.exe")) { throw "Solution Utility was not built" }
          New-Item -ItemType Directory -Force -Path "$out/SkinEditor" | Out-Null
          Copy-Item "build/SkinEditor_artefacts/Release/Skin Editor.exe" "$out/SkinEditor" -Force
          if (-not (Test-Path "$out/SkinEditor/Skin Editor.exe")) { throw "Skin Editor was not built" }
          Copy-Item "packaging/skins.json" "$out/Skins" -Force
          $n = (Get-ChildItem "$out/VST3" -Directory).Count
          Write-Host "Collected $n VST3 plugins"
          if ($n -ne 13) { throw "Expected 13 VST3 plugins, found $n" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" TheSolutionInstaller.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item OutputInstaller/The_Solution_Suite_Setup.exe
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" SkinsInstaller.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed (skins)" }
          Get-Item OutputInstaller/The_Solution_Skins_Setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: TheSolution-Windows-Installer
          path: OutputInstaller/The_Solution_Suite_Setup.exe
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: TheSolution-Windows-Skins-Installer
          path: OutputInstaller/The_Solution_Skins_Setup.exe
          retention-days: 30

  macos:
    name: macOS installer
    # Windows-first for now: the Mac build only runs when started by hand
    # (Actions tab -> Build plugins -> Run workflow) or for a v* release tag.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUNDLE_SKINS=OFF
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Gather plugins
        run: |
          set -euo pipefail
          out="The Solution"
          mkdir -p "$out/AU" "$out/VST3" "$out/CLAP" "$out/Standalone" "$out/Skins"
          cp UI/skins/*.jpg "$out/Skins/"
          for rel in build/*_artefacts/Release; do
            cp -R "$rel"/AU/*.component        "$out/AU/"         2>/dev/null || true
            cp -R "$rel"/VST3/*.vst3           "$out/VST3/"       2>/dev/null || true
            cp -R "$rel"/CLAP/*.clap           "$out/CLAP/"       2>/dev/null || true
            cp -R "$rel"/Standalone/*.app      "$out/Standalone/" 2>/dev/null || true
          done
          # Ad-hoc sign so Apple Silicon will load them (not notarized)
          find "$out" -maxdepth 2 \( -name "*.component" -o -name "*.vst3" -o -name "*.clap" -o -name "*.app" \) \
            -exec codesign --force --deep --sign - {} \;
          n=$(ls -d "$out"/AU/*.component | wc -l | tr -d ' ')
          echo "Collected $n AU plugins"
          [ "$n" -eq 13 ] || { echo "Expected 13 AU plugins, found $n"; exit 1; }

      - name: Build installer
        run: |
          v=$(sed -nE 's/^project\([^ ]+ VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          packaging/build_mac_pkg.sh "The Solution" "$v" "The Solution Suite.pkg"
          ls -la "The Solution Suite.pkg"

      - uses: actions/upload-artifact@v7
        with:
          name: TheSolution-macOS-Installer
          path: The Solution Suite.pkg
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            The_Solution_Suite_Setup.exe
            The Solution Suite.pkg
          generate_release_notes: true
