name: Build plugins

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "SkinEditor/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to publish a GitHub Release when a v* tag is pushed

jobs:
  windows:
    name: Windows (VST3, CLAP, Standalone)
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Download WebView2 SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2" -OutFile webview2.zip
          Expand-Archive -Path webview2.zip -DestinationPath webview2 -Force
          if (-not (Test-Path "webview2/build/native/include/WebView2.h")) { throw "WebView2.h missing after download" }

      - name: Configure
        run: cmake -B build -A x64 -DBUNDLE_SKINS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect plugins
        shell: pwsh
        run: |
          $out = "The Solution (Windows)"
          New-Item -ItemType Directory -Force -Path "$out/VST3","$out/CLAP","$out/Standalone","$out/Skins" | Out-Null
          Copy-Item "UI/skins/*.jpg" "$out/Skins"
          Get-ChildItem build -Directory -Filter *_artefacts | ForEach-Object {
            $rel = Join-Path $_.FullName "Release"
            Get-ChildItem "$rel/VST3" -Directory -Filter *.vst3 -ErrorAction SilentlyContinue | Copy-Item -Destination "$out/VST3" -Recurse -Force
            Get-ChildItem "$rel/CLAP" -File -Filter *.clap -ErrorAction SilentlyContinue | Copy-Item -Destination "$out/CLAP" -Force
            Get-ChildItem "$rel/Standalone" -File -Filter *.exe -ErrorAction SilentlyContinue | Copy-Item -Destination "$out/Standalone" -Force
          }
          Copy-Item ".github/INSTALL_WINDOWS.txt" "$out/HOW TO INSTALL.txt"
          $n = (Get-ChildItem "$out/VST3" -Directory).Count
          Write-Host "Collected $n VST3 plugins"
          if ($n -ne 13) { throw "Expected 13 VST3 plugins, found $n" }
          Compress-Archive -Path "$out/*" -DestinationPath "TheSolution-Windows.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: TheSolution-Windows
          path: TheSolution-Windows.zip
          retention-days: 30

  macos:
    name: macOS (AU, VST3, CLAP, Standalone - Universal)
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUNDLE_SKINS=OFF
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Collect plugins
        run: |
          set -euo pipefail
          out="The Solution (macOS)"
          mkdir -p "$out/AU" "$out/VST3" "$out/CLAP" "$out/Standalone" "$out/Skins"
          cp UI/skins/*.jpg "$out/Skins/"
          for rel in build/*_artefacts/Release; do
            cp -R "$rel"/AU/*.component        "$out/AU/"         2>/dev/null || true
            cp -R "$rel"/VST3/*.vst3           "$out/VST3/"       2>/dev/null || true
            cp -R "$rel"/CLAP/*.clap           "$out/CLAP/"       2>/dev/null || true
            cp -R "$rel"/Standalone/*.app      "$out/Standalone/" 2>/dev/null || true
          done
          # Ad-hoc sign so Apple Silicon will load them (not notarized)
          find "$out" -maxdepth 2 \( -name "*.component" -o -name "*.vst3" -o -name "*.clap" -o -name "*.app" \) \
            -exec codesign --force --deep --sign - {} \;
          cp .github/INSTALL_MACOS.txt "$out/HOW TO INSTALL.txt"
          n=$(ls -d "$out"/AU/*.component | wc -l | tr -d ' ')
          echo "Collected $n AU plugins"
          [ "$n" -eq 13 ] || { echo "Expected 13 AU plugins, found $n"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$out" TheSolution-macOS.zip

      - uses: actions/upload-artifact@v7
        with:
          name: TheSolution-macOS
          path: TheSolution-macOS.zip
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            TheSolution-Windows.zip
            TheSolution-macOS.zip
          generate_release_notes: true
